name: Release signed evidence

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'metalagman/webappsec'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out immutable tag revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify source and browser behavior
        run: npm run check && npm run deploy:validate
      - name: Install checksum-verified evidence tools
        run: npm run tools:evidence && npm run tools:signing
      - name: Build, reproduce, attest, sign, and publish one release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-ci.sh
