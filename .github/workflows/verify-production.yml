name: Verify production

# This workflow is intentionally read-only and runs verifier code from trusted main.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: Immutable SemVer release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.target.outputs.tag }}
    env:
      RELEASE_TAG: ${{ inputs.release || vars.PRODUCTION_RELEASE_TAG }}
    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Resolve explicit verification target
        id: target
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install locked verifier
        run: npm ci --ignore-scripts && npm run tools:signing
      - name: Download the explicit immutable release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/verification-release
          set +e
          node scripts/resolve-release.mjs \
            --release "$RELEASE_TAG" \
            --output .artifacts/verification-release \
            --json > verification-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Check out release source as untrusted data
        if: steps.resolve.outputs.exit_code == '0'
        id: source
        run: |
          set +e
          node scripts/resolve-source.mjs \
            --release "$RELEASE_TAG" \
            --output release-source \
            --json > verification-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify signed release, rebuild, production bytes, and SRI
        if: steps.resolve.outputs.exit_code == '0' && steps.source.outputs.exit_code == '0'
        id: verify
        run: |
          set +e
          env -u GH_TOKEN -u GITHUB_TOKEN node scripts/verify-release.mjs \
            --evidence .artifacts/verification-release \
            --expected-tag "$RELEASE_TAG" \
            --source release-source \
            --rebuild --json > verification-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Retain machine-readable report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-verification-${{ env.RELEASE_TAG }}-${{ github.run_id }}
          path: verification-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce verification result
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code || steps.source.outputs.exit_code || steps.resolve.outputs.exit_code || '2' }}
        run: '[[ "$VERIFY_EXIT_CODE" == 0 ]]'

  publish-verification:
    needs: verify-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked verifier and signer
        run: npm ci --ignore-scripts && npm run tools:signing
      - name: Download exact report from read-only job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-verification-${{ needs.verify-production.outputs.release_tag }}-${{ github.run_id }}
          path: .artifacts/verification-input
      - name: Validate, sign, and publish immutable verification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-production.outputs.release_tag }}
        run: scripts/publish-verification.sh "$RELEASE_TAG" .artifacts/verification-input
