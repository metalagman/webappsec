name: Deploy signed release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact immutable SemVer release (must equal the workflow tag ref)
        required: true
        type: string
      bootstrap:
        description: Create the Worker and Custom Domain on the first deployment only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-webappsec
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'metalagman/webappsec' && github.ref_type == 'tag' && inputs.release == github.ref_name
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out immutable workflow tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked verifier and browser
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium && npm run tools:signing
      - name: Reverify, deploy exact release, and publish signed deployment record
        id: deploy
        env:
          DEPLOY_MODE: ${{ inputs.bootstrap && 'bootstrap' || 'deploy' }}
          RELEASE_TAG: ${{ inputs.release }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/deploy-ci.sh "$DEPLOY_MODE" "$RELEASE_TAG"
