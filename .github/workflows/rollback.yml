name: Roll back or restore verified version

on:
  workflow_dispatch:
    inputs:
      action:
        description: Record this explicit transition as rollback or restore
        required: true
        type: choice
        options: [rollback, restore]
      release:
        description: Exact source release tag of the retained version
        required: true
        type: string
      manifest_digest:
        description: Exact signed manifest SHA-256
        required: true
        type: string
      version_id:
        description: Exact retained Cloudflare Worker version UUID
        required: true
        type: string
      deployment_release:
        description: Immutable signed deployment release proving this target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-webappsec
  cancel-in-progress: false

jobs:
  rollback:
    if: github.repository == 'metalagman/webappsec' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
      id-token: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out immutable rollback workflow tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check out target source as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release }}
          path: release-source
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked verifier and browser
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium && npm run tools:signing
      - name: Reverify target, deploy explicit version, and publish signed record
        run: >-
          scripts/rollback-ci.sh "${{ inputs.action }}" "${{ inputs.release }}"
          "${{ inputs.manifest_digest }}" "${{ inputs.version_id }}" "${{ inputs.deployment_release }}"
